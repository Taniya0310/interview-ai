services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interviewai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed/questions.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/interviewai
      PORT: 4000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data:
